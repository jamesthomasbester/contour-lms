name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Only needed so the build can run; nothing connects to it.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

  database:
    name: Migrations, seed and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Starts the local stack, which applies every migration and the seed
      # on a fresh database, the same way a reviewer would run it.
      - run: npx supabase start
      - run: npx supabase test db
      - run: npx supabase stop --no-backup
        if: always()
